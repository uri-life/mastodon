# Multi-architecture manifest workflow
# Run after every native build has published its platform-specific tags.

variables:
  - &registry 'ghcr.io'
  - &organization 'uri-life'
  - &repository-base 'mastodon'

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 2
      partial: false

depends_on:
  - build

when:
  - event: push
    branch: main
    path:
      include:
        - '.woodpecker/**'
        - 'manifest.yaml'
        - 'scripts/**'
        - 'versions/**'
  - event: tag
    evaluate: 'CI_COMMIT_TAG matches "v[0-9]+\\\\.[0-9]+\\\\.[0-9]+([^+]+)?\\\\+uri[0-9]+\\\\.[0-9]+"'
  - event: manual
    branch: main

steps:
  - name: detect-versions
    image: alpine:latest
    commands:
      - apk add --no-cache git
      - |
        set -eu

        ENV_FILE="../.ci-${CI_PIPELINE_PARENT}-${CI_PIPELINE_NUMBER}.env"
        scripts/detect-versions.sh "$ENV_FILE"

        # Keep version selection identical to the build pipeline.
        VERSIONS_TO_BUILD=$(sed -n 's/^VERSIONS_TO_BUILD=//p' "$ENV_FILE" | tail -n 1)
        LATEST_VERSION=$(sed -n 's/^LATEST_VERSION=//p' "$ENV_FILE" | tail -n 1)

        if [ "${CI_PIPELINE_EVENT}" = "manual" ]; then
          if [ -z "$LATEST_VERSION" ]; then
            echo "ERROR: Could not determine the latest patchset."
            exit 1
          fi
          VERSIONS_TO_BUILD="$LATEST_VERSION"
        elif [ "${CI_PIPELINE_EVENT}" = "push" ]; then
          CHANGED_FILES=$(git show --name-only --format='' HEAD 2>/dev/null || true)
          if printf '%s\n' "$CHANGED_FILES" | grep -qE '^(\.woodpecker/|scripts/|manifest\.yaml$)'; then
            if [ -z "$LATEST_VERSION" ]; then
              echo "ERROR: Could not determine the latest patchset for global CI changes."
              exit 1
            fi
            case " $VERSIONS_TO_BUILD " in
              *" $LATEST_VERSION "*) ;;
              *) VERSIONS_TO_BUILD="${VERSIONS_TO_BUILD:+$VERSIONS_TO_BUILD }$LATEST_VERSION" ;;
            esac
          fi
        fi

        if [ "${CI_PIPELINE_EVENT}" = "tag" ]; then
          TAG_SUFFIX=''
        else
          TAG_SUFFIX='-staging'
        fi

        {
          printf "VERSIONS_TO_BUILD='%s'\n" "$VERSIONS_TO_BUILD"
          printf "LATEST_VERSION='%s'\n" "$LATEST_VERSION"
          printf "TAG_SUFFIX='%s'\n" "$TAG_SUFFIX"
        } > "${ENV_FILE}.tmp"
        mv "${ENV_FILE}.tmp" "$ENV_FILE"

        echo "Patchsets for manifests: ${VERSIONS_TO_BUILD:-none}"
        echo "Latest patchset: ${LATEST_VERSION:-none}"

  - name: create-manifests
    image: docker:cli
    environment:
      IMAGE_REGISTRY: *registry
      IMAGE_ORGANIZATION: *organization
      IMAGE_REPOSITORY_BASE: *repository-base
      GITHUB_USERNAME:
        from_secret: GITHUB_USERNAME
      GITHUB_TOKEN:
        from_secret: GITHUB_TOKEN
    commands:
      - |
        set -eu

        ENV_FILE="../.ci-${CI_PIPELINE_PARENT}-${CI_PIPELINE_NUMBER}.env"
        . "$ENV_FILE"

        if [ -z "$VERSIONS_TO_BUILD" ]; then
          echo "No manifests to create."
          exit 0
        fi

        LOGGED_IN=false
        logout_registry() {
          if [ "$LOGGED_IN" = true ]; then
            docker logout "$IMAGE_REGISTRY" >/dev/null 2>&1 || true
          fi
        }
        trap logout_registry EXIT

        echo "$GITHUB_TOKEN" | docker login "$IMAGE_REGISTRY" \
          --username "$GITHUB_USERNAME" \
          --password-stdin
        LOGGED_IN=true

        REGISTRY_IMAGE="$IMAGE_REGISTRY/$IMAGE_ORGANIZATION/$IMAGE_REPOSITORY_BASE"
        REGISTRY_STREAMING="$IMAGE_REGISTRY/$IMAGE_ORGANIZATION/$IMAGE_REPOSITORY_BASE-streaming"

        for VERSION_COMBO in $VERSIONS_TO_BUILD; do
          MASTODON_VER=${VERSION_COMBO%%:*}
          URI_VER=${VERSION_COMBO#*:}
          MULTI_TAG="$MASTODON_VER-$URI_VER$TAG_SUFFIX"
          AMD64_TAG="$MULTI_TAG-amd64"
          ARM64_TAG="$MULTI_TAG-arm64"

          docker buildx imagetools create -t "$REGISTRY_IMAGE:$MULTI_TAG" \
            "$REGISTRY_IMAGE:$AMD64_TAG" \
            "$REGISTRY_IMAGE:$ARM64_TAG"
          docker buildx imagetools create -t "$REGISTRY_STREAMING:$MULTI_TAG" \
            "$REGISTRY_STREAMING:$AMD64_TAG" \
            "$REGISTRY_STREAMING:$ARM64_TAG"

          docker buildx imagetools inspect "$REGISTRY_IMAGE:$MULTI_TAG"
          docker buildx imagetools inspect "$REGISTRY_STREAMING:$MULTI_TAG"

          if [ "$VERSION_COMBO" = "$LATEST_VERSION" ]; then
            LATEST_TAG="latest$TAG_SUFFIX"

            docker buildx imagetools create -t "$REGISTRY_IMAGE:$LATEST_TAG" \
              "$REGISTRY_IMAGE:$LATEST_TAG-amd64" \
              "$REGISTRY_IMAGE:$LATEST_TAG-arm64"
            docker buildx imagetools create -t "$REGISTRY_STREAMING:$LATEST_TAG" \
              "$REGISTRY_STREAMING:$LATEST_TAG-amd64" \
              "$REGISTRY_STREAMING:$LATEST_TAG-arm64"

            docker buildx imagetools inspect "$REGISTRY_IMAGE:$LATEST_TAG"
            docker buildx imagetools inspect "$REGISTRY_STREAMING:$LATEST_TAG"
          fi
        done
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  - name: cleanup
    image: alpine:latest
    commands:
      - |
        set -eu
        ENV_FILE="../.ci-${CI_PIPELINE_PARENT}-${CI_PIPELINE_NUMBER}.env"
        rm -f "$ENV_FILE" "${ENV_FILE}.tmp"
    when:
      - status: [success, failure]

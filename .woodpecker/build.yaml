# URI Mastodon patch build workflow
# Build only affected patchsets and publish native images per platform.

variables:
  - &registry 'ghcr.io'
  - &organization 'uri-life'
  - &repository-base 'mastodon'

clone:
  git:
    image: woodpeckerci/plugin-git
    settings:
      depth: 2
      partial: false

matrix:
  platform:
    - linux/amd64
    - linux/arm64

labels:
  platform: ${platform}

when:
  - event: push
    branch: main
    path:
      include:
        - '.woodpecker/**'
        - 'manifest.yaml'
        - 'scripts/**'
        - 'versions/**'
  - event: tag
    evaluate: 'CI_COMMIT_TAG matches "v[0-9]+\\\\.[0-9]+\\\\.[0-9]+([^+]+)?\\\\+uri[0-9]+\\\\.[0-9]+"'
  - event: manual
    branch: main

steps:
  - name: detect-versions
    image: alpine:latest
    commands:
      - apk add --no-cache git
      - |
        set -eu

        ENV_FILE="../.ci-${CI_PIPELINE_PARENT}-${CI_PIPELINE_NUMBER}.env"
        scripts/detect-versions.sh "$ENV_FILE"

        # The detector writes plain assignments. Read values without sourcing
        # them so a list containing multiple patchsets remains safe.
        VERSIONS_TO_BUILD=$(sed -n 's/^VERSIONS_TO_BUILD=//p' "$ENV_FILE" | tail -n 1)
        LATEST_VERSION=$(sed -n 's/^LATEST_VERSION=//p' "$ENV_FILE" | tail -n 1)

        if [ "${CI_PIPELINE_EVENT}" = "manual" ]; then
          if [ -z "$LATEST_VERSION" ]; then
            echo "ERROR: Could not determine the latest patchset."
            exit 1
          fi
          VERSIONS_TO_BUILD="$LATEST_VERSION"
        elif [ "${CI_PIPELINE_EVENT}" = "push" ]; then
          CHANGED_FILES=$(git show --name-only --format='' HEAD 2>/dev/null || true)
          if printf '%s\n' "$CHANGED_FILES" | grep -qE '^(\.woodpecker/|scripts/|manifest\.yaml$)'; then
            if [ -z "$LATEST_VERSION" ]; then
              echo "ERROR: Could not determine the latest patchset for global CI changes."
              exit 1
            fi
            case " $VERSIONS_TO_BUILD " in
              *" $LATEST_VERSION "*) ;;
              *) VERSIONS_TO_BUILD="${VERSIONS_TO_BUILD:+$VERSIONS_TO_BUILD }$LATEST_VERSION" ;;
            esac
          fi
        fi

        if [ "${CI_PIPELINE_EVENT}" = "tag" ]; then
          TAG_SUFFIX=''
        else
          TAG_SUFFIX='-staging'
        fi

        # Quote values so later steps can safely source multiple patchsets.
        {
          printf "VERSIONS_TO_BUILD='%s'\n" "$VERSIONS_TO_BUILD"
          printf "LATEST_VERSION='%s'\n" "$LATEST_VERSION"
          printf "TAG_SUFFIX='%s'\n" "$TAG_SUFFIX"
        } > "${ENV_FILE}.tmp"
        mv "${ENV_FILE}.tmp" "$ENV_FILE"

        echo "Patchsets to build: ${VERSIONS_TO_BUILD:-none}"
        echo "Latest patchset: ${LATEST_VERSION:-none}"

  - name: apply-patchsets
    image: ubuntu:24.04
    commands:
      - |
        set -eu

        ENV_FILE="../.ci-${CI_PIPELINE_PARENT}-${CI_PIPELINE_NUMBER}.env"
        . "$ENV_FILE"

        if [ -z "$VERSIONS_TO_BUILD" ]; then
          echo "No patchsets to build."
          exit 0
        fi

        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y --no-install-recommends \
          ca-certificates \
          curl \
          git \
          jq \
          libstdc++6 \
          tar

        case "${platform}" in
          linux/amd64) URI_ASSET='uri-linux-x86_64.tar.gz' ;;
          linux/arm64) URI_ASSET='uri-linux-aarch64.tar.gz' ;;
          *) echo "ERROR: Unsupported platform: ${platform}"; exit 1 ;;
        esac

        RELEASES=$(curl --fail --silent --show-error --location --retry 3 \
          --header 'Accept: application/vnd.github+json' \
          --header 'X-GitHub-Api-Version: 2022-11-28' \
          'https://api.github.com/repos/uri-life/uri/releases?per_page=100')
        URI_TAG=$(printf '%s' "$RELEASES" | jq -er '
          map(select(.draft == false and (.tag_name | test("^v2\\."))))
          | sort_by(.published_at)
          | last
          | .tag_name
        ')
        URI_URL=$(printf '%s' "$RELEASES" | jq -er \
          --arg tag "$URI_TAG" \
          --arg asset "$URI_ASSET" '
            map(select(.tag_name == $tag))[0].assets
            | map(select(.name == $asset))[0].browser_download_url
          ')

        URI_ARCHIVE=$(mktemp)
        trap 'rm -f "$URI_ARCHIVE"' EXIT
        curl --fail --silent --show-error --location --retry 3 \
          "$URI_URL" \
          --output "$URI_ARCHIVE"
        tar -xzf "$URI_ARCHIVE" -C /usr/local/bin uri
        chmod +x /usr/local/bin/uri

        EXPECTED_URI_VERSION=${URI_TAG#v}
        ACTUAL_URI_VERSION=$(uri --version)
        if [ "$ACTUAL_URI_VERSION" != "$EXPECTED_URI_VERSION" ]; then
          echo "ERROR: URI version mismatch: expected=$EXPECTED_URI_VERSION actual=$ACTUAL_URI_VERSION"
          exit 1
        fi
        echo "URI $ACTUAL_URI_VERSION ($URI_ASSET)"

        UPSTREAM_URL=$(sed -n 's/^upstream:[[:space:]]*//p' manifest.yaml | head -n 1)
        if [ -z "$UPSTREAM_URL" ]; then
          echo "ERROR: Could not find the upstream URL in manifest.yaml."
          exit 1
        fi

        git clone --quiet --depth=1 --no-tags --no-local "$UPSTREAM_URL" mastodon

        for VERSION_COMBO in $VERSIONS_TO_BUILD; do
          MASTODON_VER=${VERSION_COMBO%%:*}
          URI_VER=${VERSION_COMBO#*:}
          BRANCH_NAME="uri/$MASTODON_VER/$URI_VER"

          uri --color never apply ./ "$MASTODON_VER" "$URI_VER" mastodon

          CURRENT_BRANCH=$(git -C mastodon branch --show-current)
          if [ "$CURRENT_BRANCH" != "$BRANCH_NAME" ]; then
            echo "ERROR: URI result branch mismatch: expected=$BRANCH_NAME actual=$CURRENT_BRANCH"
            exit 1
          fi
          if [ -n "$(git -C mastodon status --porcelain)" ]; then
            echo "ERROR: The Mastodon worktree is not clean after URI apply."
            git -C mastodon status --short
            exit 1
          fi
        done

  - name: build
    image: docker:cli
    commands:
      - |
        set -eu

        ENV_FILE="../.ci-${CI_PIPELINE_PARENT}-${CI_PIPELINE_NUMBER}.env"
        . "$ENV_FILE"

        if [ -z "$VERSIONS_TO_BUILD" ]; then
          echo "No patchsets to build."
          exit 0
        fi

        apk add --no-cache git

        for VERSION_COMBO in $VERSIONS_TO_BUILD; do
          MASTODON_VER=${VERSION_COMBO%%:*}
          URI_VER=${VERSION_COMBO#*:}
          BRANCH_NAME="uri/$MASTODON_VER/$URI_VER"
          IMAGE_NAME="mastodon-${CI_PIPELINE_PARENT}-${CI_PIPELINE_NUMBER}-$MASTODON_VER-$URI_VER"
          STREAMING_IMAGE_NAME="mastodon-streaming-${CI_PIPELINE_PARENT}-${CI_PIPELINE_NUMBER}-$MASTODON_VER-$URI_VER"

          git -C mastodon checkout --quiet "$BRANCH_NAME"

          docker build -t "$IMAGE_NAME:latest" \
            --build-arg MASTODON_VERSION_METADATA="$URI_VER" \
            --build-arg GITHUB_REPOSITORY="${CI_REPO}" \
            --build-arg SOURCE_BASE_URL="https://github.com/${CI_REPO}" \
            --build-arg SOURCE_TAG="$MASTODON_VER+$URI_VER" \
            mastodon

          docker build -t "$STREAMING_IMAGE_NAME:latest" \
            --build-arg MASTODON_VERSION_METADATA="$URI_VER" \
            --build-arg GITHUB_REPOSITORY="${CI_REPO}" \
            --build-arg SOURCE_BASE_URL="https://github.com/${CI_REPO}" \
            --build-arg SOURCE_TAG="$MASTODON_VER+$URI_VER" \
            -f mastodon/streaming/Dockerfile \
            mastodon
        done
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  - name: push
    image: docker:cli
    environment:
      IMAGE_REGISTRY: *registry
      IMAGE_ORGANIZATION: *organization
      IMAGE_REPOSITORY_BASE: *repository-base
      GITHUB_USERNAME:
        from_secret: GITHUB_USERNAME
      GITHUB_TOKEN:
        from_secret: GITHUB_TOKEN
    commands:
      - |
        set -eu

        ENV_FILE="../.ci-${CI_PIPELINE_PARENT}-${CI_PIPELINE_NUMBER}.env"
        . "$ENV_FILE"

        if [ -z "$VERSIONS_TO_BUILD" ]; then
          echo "No patchsets to push."
          exit 0
        fi

        LOGGED_IN=false
        logout_registry() {
          if [ "$LOGGED_IN" = true ]; then
            docker logout "$IMAGE_REGISTRY" >/dev/null 2>&1 || true
          fi
        }
        trap logout_registry EXIT

        echo "$GITHUB_TOKEN" | docker login "$IMAGE_REGISTRY" \
          --username "$GITHUB_USERNAME" \
          --password-stdin
        LOGGED_IN=true

        PLATFORM_SHORT=${platform##*/}
        REGISTRY_IMAGE="$IMAGE_REGISTRY/$IMAGE_ORGANIZATION/$IMAGE_REPOSITORY_BASE"
        REGISTRY_STREAMING="$IMAGE_REGISTRY/$IMAGE_ORGANIZATION/$IMAGE_REPOSITORY_BASE-streaming"

        for VERSION_COMBO in $VERSIONS_TO_BUILD; do
          MASTODON_VER=${VERSION_COMBO%%:*}
          URI_VER=${VERSION_COMBO#*:}
          IMAGE_NAME="mastodon-${CI_PIPELINE_PARENT}-${CI_PIPELINE_NUMBER}-$MASTODON_VER-$URI_VER"
          STREAMING_IMAGE_NAME="mastodon-streaming-${CI_PIPELINE_PARENT}-${CI_PIPELINE_NUMBER}-$MASTODON_VER-$URI_VER"
          BASE_TAG="$MASTODON_VER-$URI_VER$TAG_SUFFIX-$PLATFORM_SHORT"

          docker image tag "$IMAGE_NAME:latest" "$REGISTRY_IMAGE:$BASE_TAG"
          docker image tag "$STREAMING_IMAGE_NAME:latest" "$REGISTRY_STREAMING:$BASE_TAG"
          docker image push "$REGISTRY_IMAGE:$BASE_TAG"
          docker image push "$REGISTRY_STREAMING:$BASE_TAG"

          if [ "$VERSION_COMBO" = "$LATEST_VERSION" ]; then
            LATEST_TAG="latest$TAG_SUFFIX-$PLATFORM_SHORT"
            docker image tag "$IMAGE_NAME:latest" "$REGISTRY_IMAGE:$LATEST_TAG"
            docker image tag "$STREAMING_IMAGE_NAME:latest" "$REGISTRY_STREAMING:$LATEST_TAG"
            docker image push "$REGISTRY_IMAGE:$LATEST_TAG"
            docker image push "$REGISTRY_STREAMING:$LATEST_TAG"
          fi
        done
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  - name: cleanup
    image: docker:cli
    commands:
      - |
        set -eu

        ENV_FILE="../.ci-${CI_PIPELINE_PARENT}-${CI_PIPELINE_NUMBER}.env"
        if [ ! -f "$ENV_FILE" ]; then
          exit 0
        fi
        VERSIONS_TO_BUILD=$(sed -n "s/^VERSIONS_TO_BUILD=['\"]\{0,1\}\([^'\"]*\)['\"]\{0,1\}$/\1/p" "$ENV_FILE" | tail -n 1)

        for VERSION_COMBO in $VERSIONS_TO_BUILD; do
          MASTODON_VER=${VERSION_COMBO%%:*}
          URI_VER=${VERSION_COMBO#*:}
          IMAGE_NAME="mastodon-${CI_PIPELINE_PARENT}-${CI_PIPELINE_NUMBER}-$MASTODON_VER-$URI_VER"
          STREAMING_IMAGE_NAME="mastodon-streaming-${CI_PIPELINE_PARENT}-${CI_PIPELINE_NUMBER}-$MASTODON_VER-$URI_VER"

          docker image rm "$IMAGE_NAME:latest" >/dev/null 2>&1 || true
          docker image rm "$STREAMING_IMAGE_NAME:latest" >/dev/null 2>&1 || true
        done

        rm -f "$ENV_FILE" "${ENV_FILE}.tmp"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    when:
      - status: [success, failure]
